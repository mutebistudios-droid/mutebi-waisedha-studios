
name: Build MWS Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare app
        run: |
          mkdir -p www
          curl -fL \
            https://mutebistudios-droid.github.io/mutebi-waisedha-studios/ \
            -o www/index.html
          printf '{"name":"mws-android","version":"1.0.0","private":true,"dependencies":{"@capacitor/core":"^7.4.3"},"devDependencies":{"@capacitor/cli":"^7.4.3","@capacitor/android":"^7.4.3"}}' > package.json
          printf '{"appId":"com.mutebiwaisedha.studios","appName":"MUTEBI WAISEDHA STUDIOS","webDir":"www"}' > capacitor.config.json
          npm install
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mws-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

